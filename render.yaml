# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Database: a free Neon Postgres (Render's free Postgres expires after 30 days).
services:
  - type: web
    name: night-hunter-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen --no-dev --extra postgres
    startCommand: .venv/bin/uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL # paste Neon's connection string (postgresql://...?sslmode=require)
        sync: false
      - key: GAME_API_KEY # long random string; also goes into the Roblox secret
        generateValue: true
      - key: ADMIN_API_KEY # long random string; used for POST /v1/train
        generateValue: true
